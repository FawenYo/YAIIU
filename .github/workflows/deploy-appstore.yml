name: Deploy to App Store Connect

on:
  push:
    branches:
      - main
    paths:
      - "YAIIU/**"
      - ".github/workflows/deploy-appstore.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - "YAIIU/**"
      - ".github/workflows/deploy-appstore.yml"

permissions:
  contents: read

jobs:
  acquire-deployment-lock:
    name: Acquire TestFlight deployment lock
    if: >-
      github.event_name == 'push' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Acquire repository deployment lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          run_id = int(os.environ["RUN_ID"])
          run_attempt = int(os.environ["RUN_ATTEMPT"])
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          lock_ref = "refs/tags/ci-testflight-deploy-lock"
          lock_ref_api = "tags/ci-testflight-deploy-lock"

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method, url, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(
                  url, data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read()
                  return resp.status, json.loads(raw) if raw else None

          api = f"https://api.github.com/repos/{repo}"

          _, base_commit = request("GET", f"{api}/git/commits/{head_sha}")
          _, lock_commit = request(
              "POST",
              f"{api}/git/commits",
              {
                  "message": (
                      f"TestFlight deployment lock "
                      f"run_id={run_id} attempt={run_attempt}"
                  ),
                  "tree": base_commit["tree"]["sha"],
                  "parents": [head_sha],
              },
          )
          lock_sha = lock_commit["sha"]
          owner_re = re.compile(r"run_id=(\d+) attempt=(\d+)")

          while True:
              try:
                  request(
                      "POST",
                      f"{api}/git/refs",
                      {"ref": lock_ref, "sha": lock_sha},
                  )
                  print(
                      f"✅ Acquired TestFlight deployment lock "
                      f"for run {run_id}, attempt {run_attempt}"
                  )
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code != 422:
                      raise

              try:
                  _, ref = request("GET", f"{api}/git/ref/{lock_ref_api}")
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      continue
                  raise

              owner_sha = ref["object"]["sha"]
              _, owner_commit = request("GET", f"{api}/git/commits/{owner_sha}")
              match = owner_re.search(owner_commit.get("message", ""))
              if not match:
                  raise RuntimeError(
                      "Existing TestFlight lock has an unrecognized owner; "
                      "refusing to delete it automatically."
                  )

              owner_run = int(match.group(1))
              owner_attempt = int(match.group(2))

              if owner_run == run_id and owner_attempt == run_attempt:
                  print("✅ This workflow attempt already owns the lock")
                  break

              stale = False
              try:
                  _, owner = request("GET", f"{api}/actions/runs/{owner_run}")
                  current_attempt = int(owner.get("run_attempt", 1))
                  if owner["status"] == "completed":
                      stale = True
                  elif current_attempt > owner_attempt:
                      stale = True
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      stale = True
                  else:
                      raise

              if stale:
                  print(
                      f"🧹 Removing stale lock from run {owner_run}, "
                      f"attempt {owner_attempt}"
                  )
                  try:
                      request("DELETE", f"{api}/git/refs/{lock_ref_api}")
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise
                  continue

              print(
                  f"⏳ Lock held by run {owner_run}, attempt {owner_attempt}; "
                  "waiting..."
              )
              time.sleep(15)
          PYEOF

  deploy:
    name: Upload to App Store Connect
    needs: acquire-deployment-lock
    if: >-
      github.event_name == 'push' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login == github.repository_owner &&
        github.actor == github.repository_owner &&
        github.triggering_actor == github.repository_owner
      )
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}
          APPSTORE_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          PP_PATH=$RUNNER_TEMP/appstore_profile.mobileprovision
          PP_EXT_PATH=$RUNNER_TEMP/appstore_extension_profile.mobileprovision

          # Decode files from secrets
          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$APPSTORE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$APPSTORE_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_EXT_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          cp $PP_EXT_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Get next build number from App Store Connect
        id: build_number
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Query App Store Connect API for the latest build number, then +1

          # Ensure PyJWT with cryptography backend is available for ES256
          pip3 install PyJWT cryptography --quiet --break-system-packages

          BUILD_NUMBER=$(python3 - <<'PYEOF'
          import json, time, os, sys, urllib.request, urllib.error, base64
          import jwt

          key_id = os.environ["APP_STORE_CONNECT_API_KEY_ID"]
          issuer_id = os.environ["APP_STORE_CONNECT_ISSUER_ID"]
          bundle_id = "com.fawenyo.yaiiu"

          # Decode API key directly in memory (never written to disk)
          private_key = base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_BASE64"])

          # Generate JWT token for App Store Connect API
          now = int(time.time())
          token = jwt.encode(
              {"iss": issuer_id, "iat": now, "exp": now + 300, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id}
          )
          headers = {"Authorization": f"Bearer {token}"}

          def fetch_json(url, attempts=5):
              for attempt in range(attempts):
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req) as resp:
                          return json.loads(resp.read())
                  except urllib.error.HTTPError as exc:
                      retryable = exc.code == 429 or 500 <= exc.code < 600
                      if not retryable or attempt == attempts - 1:
                          raise
                      retry_after = exc.headers.get("Retry-After")
                      delay = int(retry_after) if retry_after and retry_after.isdigit() else min(2 ** attempt, 30)
                      print(
                          f"App Store Connect returned HTTP {exc.code}; "
                          f"retrying in {delay}s ({attempt + 1}/{attempts})...",
                          file=sys.stderr,
                      )
                      time.sleep(delay)
                  except urllib.error.URLError:
                      if attempt == attempts - 1:
                          raise
                      delay = min(2 ** attempt, 30)
                      print(
                          f"App Store Connect request failed; "
                          f"retrying in {delay}s ({attempt + 1}/{attempts})...",
                          file=sys.stderr,
                      )
                      time.sleep(delay)

          # Step 1: Get app ID by bundle ID
          app_url = f"https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]={bundle_id}&fields[apps]=bundleId"
          app_data = fetch_json(app_url)

          if not app_data.get("data"):
              print(f"Error: App with bundle ID '{bundle_id}' not found.", file=sys.stderr)
              sys.exit(1)

          app_id = app_data["data"][0]["id"]

          # Step 2: Find the highest bundle version across both processed builds
          # and build uploads that may still be processing. Looking only at /builds
          # can race with a just-uploaded build that has not appeared there yet.
          max_version = 0

          def update_max_from_url(url, attribute):
              global max_version
              while url:
                  data = fetch_json(url)

                  for item in data.get("data", []):
                      try:
                          v = int(item["attributes"][attribute])
                          if v > max_version:
                              max_version = v
                      except (ValueError, TypeError, KeyError):
                          pass

                  url = data.get("links", {}).get("next")

          # Processed builds.
          update_max_from_url(
              f"https://api.appstoreconnect.apple.com/v1/builds"
              f"?filter[app]={app_id}&fields[builds]=version&limit=200",
              "version",
          )

          # In-flight and completed upload reservations. This catches versions that
          # Apple has accepted but has not exposed through /v1/builds yet.
          update_max_from_url(
              f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/buildUploads"
              f"?fields[buildUploads]=cfBundleVersion&limit=200",
              "cfBundleVersion",
          )

          print(max_version + 1, end="")
          PYEOF
          )

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "✅ Next build number: $BUILD_NUMBER"

      - name: Generate BuildInfo.swift
        working-directory: YAIIU
        run: |
          export MARKETING_VERSION="0.1.10"
          export CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.BUILD_NUMBER }}"
          bash Scripts/set_build_info.sh

      - name: Generate ExportOptions plist
        env:
          APPSTORE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_NAME }}
          APPSTORE_EXTENSION_PROVISIONING_PROFILE_NAME: ${{ secrets.APPSTORE_EXTENSION_PROVISIONING_PROFILE_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.fawenyo.yaiiu</key>
              <string>${APPSTORE_PROVISIONING_PROFILE_NAME}</string>
              <key>com.fawenyo.yaiiu.BackgroundUploadExtension</key>
              <string>${APPSTORE_EXTENSION_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Configure manual signing in project
        working-directory: YAIIU
        env:
          APPSTORE_PROVISIONING_PROFILE_NAME: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_NAME }}
          APPSTORE_EXTENSION_PROVISIONING_PROFILE_NAME: ${{ secrets.APPSTORE_EXTENSION_PROVISIONING_PROFILE_NAME }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Patch pbxproj to set per-target provisioning profiles.
          # Cannot use xcodebuild CLI PROVISIONING_PROFILE_SPECIFIER because
          # it applies globally to ALL targets, causing a bundle ID mismatch
          # for the BackgroundUploadExtension target.
          python3 - <<'PYEOF'
          import os

          pbxproj = "YAIIU.xcodeproj/project.pbxproj"
          with open(pbxproj, "r") as f:
              lines = f.readlines()

          app_profile = os.environ["APPSTORE_PROVISIONING_PROFILE_NAME"]
          ext_profile = os.environ["APPSTORE_EXTENSION_PROVISIONING_PROFILE_NAME"]
          team_id = os.environ["TEAM_ID"]

          # Track which buildSettings block we're in
          in_build_settings = False
          current_target = None  # "app", "ext", or None
          brace_depth = 0

          result = []
          for line in lines:
              stripped = line.strip()

              if "buildSettings = {" in stripped:
                  in_build_settings = True
                  current_target = None
                  brace_depth = 1
                  result.append(line)
                  continue

              if in_build_settings:
                  # Track braces for nested structures like arrays
                  brace_depth += stripped.count("{") - stripped.count("}")

                  if "CODE_SIGN_ENTITLEMENTS = YAIIU/YAIIU.entitlements" in stripped:
                      current_target = "app"
                  elif "CODE_SIGN_ENTITLEMENTS = BackgroundUploadExtension/" in stripped:
                      current_target = "ext"

                  # Patch CODE_SIGN_STYLE to Manual for both targets
                  if current_target and "CODE_SIGN_STYLE = Automatic" in stripped:
                      line = line.replace("Automatic", "Manual")

                  # Patch PROVISIONING_PROFILE_SPECIFIER for extension
                  if current_target == "ext" and 'PROVISIONING_PROFILE_SPECIFIER = ""' in stripped:
                      line = line.replace(
                          'PROVISIONING_PROFILE_SPECIFIER = ""',
                          f'PROVISIONING_PROFILE_SPECIFIER = "{ext_profile}"'
                      )

                  # Add PROVISIONING_PROFILE_SPECIFIER for app target before closing brace
                  if current_target == "app" and brace_depth == 0 and stripped == "};":
                      indent = line[:len(line) - len(line.lstrip())]
                      result.append(f'{indent}\tPROVISIONING_PROFILE_SPECIFIER = "{app_profile}";\n')

                  if brace_depth == 0:
                      in_build_settings = False
                      current_target = None

              result.append(line)

          with open(pbxproj, "w") as f:
              f.writelines(result)

          print("✅ Patched pbxproj with per-target provisioning profiles")
          PYEOF

      - name: Build archive
        working-directory: YAIIU
        run: |
          set -o pipefail
          xcodebuild archive \
            -project YAIIU.xcodeproj \
            -scheme YAIIU \
            -configuration Release \
            -archivePath $RUNNER_TEMP/YAIIU.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.BUILD_NUMBER }}" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            2>&1 | tee $RUNNER_TEMP/xcodebuild-archive.log | xcpretty --color

      - name: Show raw build log on failure
        if: failure()
        run: cat $RUNNER_TEMP/xcodebuild-archive.log | grep -A 5 -i "error:" || tail -100 $RUNNER_TEMP/xcodebuild-archive.log

      - name: Export IPA (App Store)
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/YAIIU.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            2>&1 | tee $RUNNER_TEMP/xcodebuild-export.log | xcpretty --color

      - name: Show raw export log on failure
        if: failure()
        run: cat $RUNNER_TEMP/xcodebuild-export.log | tail -50

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Decode API key
          API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o $API_KEY_PATH

          # Create API key directory for xcrun
          mkdir -p ~/.private_keys
          cp $API_KEY_PATH ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          # altool retries some server failures internally, but those retries are
          # very aggressive. Retry the whole upload with backoff so transient
          # App Store Connect 5xx/502 failures have time to recover.
          MAX_ATTEMPTS=4
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            LOG_PATH="$RUNNER_TEMP/altool-upload-attempt-${ATTEMPT}.log"

            set +e
            xcrun altool --upload-app \
              --type ios \
              --file $RUNNER_TEMP/export/YAIIU.ipa \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --verbose 2>&1 | tee "$LOG_PATH"
            STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$STATUS" -eq 0 ]; then
              echo "✅ Upload succeeded on attempt ${ATTEMPT}"
              break
            fi

            if [ "$ATTEMPT" -eq "$MAX_ATTEMPTS" ]; then
              echo "❌ Upload failed after ${MAX_ATTEMPTS} attempts"
              exit "$STATUS"
            fi

            if grep -Eqi 'status code: 5[0-9]{2}|received status code 5[0-9]{2}|unexpected error occurred.*\(5[0-9]{2}\)|HTTP.*5[0-9]{2}|502 Bad Gateway' "$LOG_PATH"; then
              DELAY=$((30 * (2 ** (ATTEMPT - 1))))
              echo "⚠️ App Store Connect returned a transient 5xx error; retrying in ${DELAY}s..."
              sleep "$DELAY"
            else
              echo "❌ Upload failed with a non-transient error; not retrying."
              exit "$STATUS"
            fi
          done

      - name: Upload IPA as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: YAIIU-AppStore-${{ github.sha }}
          path: ${{ runner.temp }}/export/YAIIU.ipa
          retention-days: 30

      - name: Cleanup keychain
        if: always()
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/appstore_profile.mobileprovision
          rm -f $RUNNER_TEMP/appstore_extension_profile.mobileprovision
          rm -f $RUNNER_TEMP/AuthKey.p8
          rm -f ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

  release-deployment-lock:
    name: Release TestFlight deployment lock
    needs: [acquire-deployment-lock, deploy]
    if: >-
      always() &&
      needs.acquire-deployment-lock.result == 'success' &&
      (
        github.event_name == 'push' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == github.repository_owner &&
          github.actor == github.repository_owner &&
          github.triggering_actor == github.repository_owner
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release repository deployment lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          run_id = int(os.environ["RUN_ID"])
          run_attempt = int(os.environ["RUN_ATTEMPT"])
          token = os.environ["GITHUB_TOKEN"]
          ref_api = "tags/ci-testflight-deploy-lock"
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          try:
              ref = get(f"{api}/git/ref/{ref_api}")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("ℹ️ Deployment lock is already absent")
                  raise SystemExit(0)
              raise

          commit = get(f"{api}/git/commits/{ref['object']['sha']}")
          match = re.search(
              r"run_id=(\d+) attempt=(\d+)",
              commit.get("message", ""),
          )
          if not match:
              raise RuntimeError(
                  "Deployment lock owner is unrecognized; refusing to delete it."
              )

          owner = (int(match.group(1)), int(match.group(2)))
          if owner != (run_id, run_attempt):
              print(
                  f"ℹ️ Lock belongs to run {owner[0]}, attempt {owner[1]}; "
                  "leaving it untouched"
              )
              raise SystemExit(0)

          req = urllib.request.Request(
              f"{api}/git/refs/{ref_api}",
              headers=headers,
              method="DELETE",
          )
          with urllib.request.urlopen(req):
              pass
          print("✅ Released TestFlight deployment lock")
          PYEOF
